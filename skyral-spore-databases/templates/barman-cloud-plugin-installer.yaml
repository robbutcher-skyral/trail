{{- if .Values.installPlugin.enabled }}
{{/*
Barman Cloud Plugin Installer
Installs the Barman Cloud Plugin using a Helm pre-install hook.
The plugin must be in the same namespace as the CloudNativePG operator for proper discovery.
*/}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: barman-plugin-installer
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: barman-plugin-installer
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
rules:
  # Permissions needed to install the Barman Cloud Plugin
  # Note: CRDs are installed separately from deploy/crds/ directory
  # Must include all permissions that the plugin's ClusterRoles grant (RBAC escalation protection)

  # Core resources
  - apiGroups: [""]
    resources: ["serviceaccounts", "services", "configmaps", "events"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["create", "get", "list", "watch", "update", "patch", "delete"]

  # Apps resources
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["create", "get", "list", "update", "patch", "watch"]

  # RBAC resources (including watch verbs needed by plugin)
  - apiGroups: ["rbac.authorization.k8s.io"]
    resources: ["clusterroles", "clusterrolebindings", "roles", "rolebindings"]
    verbs: ["create", "get", "list", "watch", "update", "patch"]

  # Coordination resources (for leader election)
  - apiGroups: ["coordination.k8s.io"]
    resources: ["leases"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]

  # Authentication/Authorization (for metrics)
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
  - apiGroups: ["authorization.k8s.io"]
    resources: ["subjectaccessreviews"]
    verbs: ["create"]

  # Barman Cloud Plugin resources
  - apiGroups: ["barmancloud.cnpg.io"]
    resources: ["objectstores", "objectstores/status", "objectstores/finalizers"]
    verbs: ["create", "delete", "get", "list", "patch", "update", "watch"]

  # CloudNativePG resources (plugin needs to watch these)
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["backups", "clusters", "clusters/finalizers"]
    verbs: ["get", "list", "watch", "update"]

  # Admission webhooks
  - apiGroups: ["admissionregistration.k8s.io"]
    resources: ["validatingwebhookconfigurations", "mutatingwebhookconfigurations"]
    verbs: ["create", "get", "list", "update", "patch"]

  # cert-manager resources
  - apiGroups: ["cert-manager.io"]
    resources: ["certificates", "issuers"]
    verbs: ["create", "get", "list", "update", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: barman-plugin-installer-metrics
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
rules:
  # Non-resource URLs for metrics (separate ClusterRole needed)
  - nonResourceURLs: ["/metrics"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: barman-plugin-installer-metrics
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: barman-plugin-installer-metrics
subjects:
  - kind: ServiceAccount
    name: barman-plugin-installer
    namespace: {{ .Release.Namespace }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: barman-plugin-installer
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: barman-plugin-installer
subjects:
  - kind: ServiceAccount
    name: barman-plugin-installer
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: barman-plugin-manifest
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
data:
  manifest.yaml: |
{{ .Files.Get "manifests/barman-cloud-plugin.yaml" | replace "{{ .Release.Namespace }}" .Release.Namespace | indent 4 }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: install-barman-plugin
  annotations:
    "helm.sh/hook": pre-install
    "helm.sh/hook-weight": "-4"
    "helm.sh/hook-delete-policy": hook-succeeded,hook-failed
spec:
  template:
    spec:
      serviceAccountName: barman-plugin-installer
      restartPolicy: Never
      containers:
        - name: installer
          image: {{ .Values.installPlugin.kubectlImage }}
          command:
            - /bin/sh
            - -c
            - |
              set -ex

              echo "Installing Barman Cloud Plugin v{{ .Values.installPlugin.version }}..."
              kubectl apply --validate=false -f /manifests/manifest.yaml

              echo "Waiting for plugin deployment to be ready..."
              kubectl rollout status deployment -n {{ .Release.Namespace }} barman-cloud --timeout=3m

              echo "✅ Barman Cloud Plugin v{{ .Values.installPlugin.version }} installed successfully"
          volumeMounts:
            - name: manifests
              mountPath: /manifests
              readOnly: true
      volumes:
        - name: manifests
          configMap:
            name: barman-plugin-manifest
{{- end }}
