{{- if .Values.testing.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: test-runner
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: test-runner
rules:
  # Allow reading CloudNativePG clusters to check readiness
  - apiGroups: ["postgresql.cnpg.io"]
    resources: ["clusters"]
    verbs: ["get", "list", "watch"]
  # Allow reading secrets to verify cluster initialization
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: test-runner
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: test-runner
subjects:
  - kind: ServiceAccount
    name: test-runner
    namespace: {{ .Release.Namespace }}
{{- end }}
