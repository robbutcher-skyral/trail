{{- if .Values.testing.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-postgres-connection"
  annotations:
    "helm.sh/hook": test
spec:
  containers:
    - name: psql
      image: postgres:16-alpine
      command:
      - /bin/bash
      - -c
      - |
        export PGPASSWORD="$(password)"
        for i in {1..10}
        do
          echo "connection attempt $i of 10"

          psql -h "$host" -U "$user" -c "\\l"
          code=$?

          # exit code 2 is for connection errors -- waiting for cluster to come up
          if [ $code -ne 2 ]; then
            exit $code
          fi

          sleep 10
        done

        echo "failed to connect to postgres cluster" && exit 1
      envFrom:
        - secretRef:
            name: test-cluster-superuser
  restartPolicy: Never
{{- end }}
