{{- if .Values.testing.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-postgres-locale"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
spec:
  containers:
    - name: psql
      image: postgres:16-alpine
      command:
      - /bin/bash
      - -c
      - |
        export PGPASSWORD="$(password)"

        echo "=== Verifying PostgreSQL locale configuration ==="

        echo "--- Querying locale GUC settings ---"
        psql -h "$host" -U "$user" -c "
          SELECT name, setting
          FROM pg_settings
          WHERE name IN ('lc_messages', 'lc_monetary', 'lc_numeric', 'lc_time', 'lc_collate', 'lc_ctype')
          ORDER BY name;
        " || { echo "ERROR: Failed to query locale settings from pg_settings"; exit 1; }

        echo "--- Verifying locale settings are non-empty ---"
        EMPTY_LOCALES=$(psql -h "$host" -U "$user" -At -c "
          SELECT count(*)
          FROM pg_settings
          WHERE name IN ('lc_messages', 'lc_monetary', 'lc_numeric', 'lc_time')
            AND (setting IS NULL OR setting = '');
        ")
        if [ -z "$EMPTY_LOCALES" ]; then
          echo "ERROR: Failed to query locale settings" && exit 1
        fi
        if [ "$EMPTY_LOCALES" != "0" ]; then
          echo "ERROR: One or more locale settings are empty (count: $EMPTY_LOCALES)" && exit 1
        fi
        echo "OK: All locale settings are non-empty"

        echo "--- Testing monetary formatting (exercises lc_monetary) ---"
        psql -h "$host" -U "$user" -c "SELECT to_char(1234.56::numeric, 'FM999G999D99') AS monetary_format;" || \
          { echo "ERROR: Monetary formatting failed - lc_monetary may be misconfigured"; exit 1; }

        echo "--- Testing numeric formatting (exercises lc_numeric) ---"
        psql -h "$host" -U "$user" -c "SELECT to_char(9876543.21::numeric, 'FM999G999G999D99') AS numeric_format;" || \
          { echo "ERROR: Numeric formatting failed - lc_numeric may be misconfigured"; exit 1; }

        echo "--- Testing time/date formatting (exercises lc_time) ---"
        psql -h "$host" -U "$user" -c "SELECT to_char(TIMESTAMP '2024-01-15 10:30:00', 'YYYY-MM-DD HH24:MI:SS') AS time_format;" || \
          { echo "ERROR: Time/date formatting failed - lc_time may be misconfigured"; exit 1; }

        echo "--- Testing string collation (exercises lc_collate, lc_ctype) ---"
        psql -h "$host" -U "$user" -c "
          SELECT array_agg(word ORDER BY word) AS sorted
          FROM (VALUES ('banana'), ('apple'), ('cherry'), ('date')) t(word);
        " || { echo "ERROR: String collation failed - lc_collate/lc_ctype may be misconfigured"; exit 1; }

        echo "--- Testing locale-dependent message handling (exercises lc_messages) ---"
        psql -h "$host" -U "$user" -c "DO \$\$ BEGIN RAISE NOTICE 'locale test message'; END \$\$;" || \
          { echo "ERROR: Locale-dependent message handling failed - lc_messages may be misconfigured"; exit 1; }

        echo "=== All locale configuration checks passed ==="
      envFrom:
        - secretRef:
            name: test-cluster-superuser
  restartPolicy: Never
{{- end }}
