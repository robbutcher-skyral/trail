{{- if .Values.testing.enabled }}
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-backups"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "0"
spec:
  containers:
    - name: psql
      image: postgres:16-alpine
      command:
      - /bin/bash
      - -c
      - |
        export PGPASSWORD="$(password)"

        CONNECTED=false
        # Await database connection
        for i in {1..10}
        do
          echo "connection attempt $i of 10"

          psql -h "$host" -U "$user" -c "\\l"
          code=$?

          # exit code 2 is for connection errors -- waiting for cluster to come up
          if [ $code -ne 2 ]; then
            CONNECTED=true
            break
          fi

          sleep 10
        done

        if [ "$CONNECTED" = false ]; then
          echo "failed to connect to postgres cluster" && exit 1
        fi

        psql -h "$host" -U "$user" -c "CREATE TABLE test_table (id serial PRIMARY KEY, name VARCHAR(50));"
        psql -h "$host" -U "$user" -c "INSERT INTO test_table (name) VALUES ('veryuniquestring');"
      envFrom:
        - secretRef:
            name: test-cluster-superuser
  restartPolicy: Never
---
apiVersion: postgresql.cnpg.io/v1
kind: Backup
metadata:
  name: test-backup
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "1"
spec:
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
  cluster:
    name: test-cluster
---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: test-cluster-backup
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "2"
spec:
  instances: 1
  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql
    major: 16
  storage:
    size: 128Mi
  enableSuperuserAccess: true
  monitoring:
    enablePodMonitor: true
  bootstrap:
    recovery:
      source: source
  externalClusters:
    - name: source
      plugin:
        name: barman-cloud.cloudnative-pg.io
        parameters:
          barmanObjectName: test-minio
          serverName: test-cluster
---
apiVersion: v1
kind: Pod
metadata:
  name: "{{ .Release.Name }}-test-backups-verify"
  annotations:
    "helm.sh/hook": test
    "helm.sh/hook-weight": "3"
spec:
  containers:
    - name: psql
      image: postgres:16-alpine
      command:
      - /bin/bash
      - -c
      - |
        export PGPASSWORD="$(password)"

        CONNECTED=false
        # Await database connection (backup recovery can take several minutes)
        for i in {1..20}
        do
          echo "connection attempt $i of 20"

          psql -h "$host" -U "$user" -c "\\l"
          code=$?

          # exit code 2 is for connection errors -- waiting for cluster to come up
          if [ $code -ne 2 ]; then
            CONNECTED=true
            break
          fi

          sleep 30
        done

        if [ "$CONNECTED" = false ]; then
          echo "failed to connect to postgres cluster" && exit 1
        fi

        # Check data exists in backup
        psql -h "$host" -U "$user" -c "SELECT * FROM test_table;"
        check=$(psql -h "$host" -U "$user" -c "SELECT * FROM test_table;" | grep veryuniquestring)
        if [ -z "$check" ]; then
          echo "failed to find data in backup" && exit 1
        fi
      envFrom:
        - secretRef:
            name: test-cluster-backup-superuser
  restartPolicy: Never
{{- end }}
