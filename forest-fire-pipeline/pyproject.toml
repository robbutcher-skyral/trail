# Dependencies

[project]
name = "forest-fire-pipeline"
version = "0.1.0"
description = "Forest Fire Pipeline"
requires-python = ">=3.12,<3.14"
dependencies = [
    "skyral-record-store-utils",
    "dagster",
    "dagster-postgres",
    "dagster-webserver",
    "universal-pathlib",
    "fsspec[http,s3]"
]

# Dev Dependencies
[project.optional-dependencies]
dev = [
    "dagster-dg-cli",
    "mypy"
]

# uv Configuration for Google Artifact Registry
[tool.uv]
keyring-provider = "subprocess"
package = true

[[tool.uv.index]]
name = "skyral-python"
url = "https://oauth2accesstoken@europe-west2-python.pkg.dev/skyr-artefacts/skyral-python/simple"
default = true

# Dagster Configuration
[tool.dagster]
module_name = "pipeline"

[tool.dg]
directory_type = "project"

[tool.dg.project]
root_module = "pipeline"

