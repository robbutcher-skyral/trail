# See our documentation for reusable Skyral Actions
# https://backstage.skyral.dev/catalog/default/system/skyral-actions
name: premerge

on:
  pull_request:
  merge_group:
    types: [checks_requested]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write
  pull-requests: write

# Cancel a PR's in-progress run when it is updated, while letting different PRs run
# concurrently. pull_request events key the group on the PR number; merge_group and
# workflow_dispatch fall back to github.ref (the unique gh-readonly-queue ref / branch),
# so cancel-in-progress never cancels a merge-queue check.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:

  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - name: Install uv
        uses: astral-sh/setup-uv@v7
      - id: bootstrap
        uses: skyral-group/skyral-ee-actions/bootstrap@v1
      - uses: skyral-group/skyral-ee-actions/pre-commit@v1
      - name: Install dependencies
        run: uv sync --locked --all-extras --all-groups --dev
      - name: Test building MkDocs site
        run: uv run --locked --group docs mkdocs build

  required-steps:
    name: 🪜 Required steps
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [checks]
    steps:
      - run: |
          [[ "${{ needs.checks.result }}" != "success" ]] && exit 1
          echo "Required steps passed"

  merge-gate:
    name: 🛡 Merge gate
    runs-on: ubuntu-latest
    if: ${{ always() }}
    needs: [required-steps]
    steps:
      - run: |
          [[ "${{ needs.required-steps.result == 'success' }}" == "false" ]] && exit 1
          echo "Merge gate passed"
