{{- if .Values.externalSecrets.enabled }}
{{- range .Values.externalSecrets.secrets }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .name }}
  namespace: {{ .namespace | default $.Release.Namespace }}
spec:
  refreshInterval: {{ .refreshInterval | default "5m" }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStore.name }}
    kind: {{ $.Values.externalSecrets.secretStore.kind | default "SecretStore" }}
  target:
    name: {{ .name }}
    creationPolicy: {{ default "Owner" }}
  {{- if .data }}
  data:
    {{- range .data }}
    - secretKey: {{ .secretKey }}
      remoteRef:
        key: {{ .remoteRef.key }}
        {{- if .remoteRef.property }}
        property: {{ .remoteRef.property }}
        {{- end }}
    {{- end }}
  {{- end }}
  {{- if .dataFrom }}
  dataFrom:
    {{- range .dataFrom }}
    - remoteRef:
        key: {{ .key }}
    {{- end }}
  {{- end }}
  {{- if .template }}
  template:
    data:
      {{- range $key, $value := .template.data }}
      {{ $key }}: |
        {{ $value | nindent 8 }}
      {{- end }}
  {{- end }}
{{- end }}
{{- end }}
