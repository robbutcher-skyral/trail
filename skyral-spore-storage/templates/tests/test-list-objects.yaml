apiVersion: v1
kind: Pod
metadata:
  name: {{ .Release.Name }}-test-list-objects
  annotations:
    "helm.sh/hook": test
spec:
  containers:
  - name: aws-cli
    # renovate: datasource=docker depName=amazon/aws-cli versioning=docker
    image: amazon/aws-cli:2.15.42
    command:
      - /bin/bash
      - -c
      - |
        for i in {1..10}
        do
          echo "connection attempt $i of 10"
          aws s3 ls --endpoint-url http://minio.default.svc.cluster.local s3://{{ (index .Values.tenant.initBuckets 0).name }}
          code=$?

          if [ $code -eq 0 ]; then
            echo "success!"
            exit 0
          fi
          sleep 20
        done

        echo "failed to list objects in {{ (index .Values.tenant.initBuckets 0).name }}" && exit 1
    envFrom:
    - secretRef:
        name: {{ .Release.Name }}-connection-secret
  restartPolicy: Never
