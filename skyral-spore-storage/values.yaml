global:
  env:
    domain: "" # Domain for HTTPRoutes
  clusterCertIssuer: gcp-ca
  clusterName: "" # Name of your Kubernetes cluster
  gateway:
    name: spore-essentials-gateway
    namespace: spore-essentials

istioExtras:
  enabled: true
  waypoint:
    enabled: true

connectionSecret:
  enabled: false
  job:
    image:
      # renovate: datasource=docker depName=hardened/k8s-tools-ubi9 packageName=europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/k8s-tools-ubi9
      repository: europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/k8s-tools-ubi9
      tag: "ubi9-v1.6.27"
      imagePullPolicy: IfNotPresent

monitoring:
  serviceMonitor:
    enabled: true

snapshots:
  # Enable to install a VolumeSnapshotClass that can be used to create snapshots when
  # provisioning MinIO with CSI-provisioned volumes (for example, using the standard-rwo storage class)
  enabled: false
  volumeSnapshotClass:
    driver: pd.csi.storage.gke.io
    deletionPolicy: Delete

operator: # The source of operator https://github.com/minio/operator/blob/v4.5.8/helm/operator/values.yaml
  operator:
    env:
      - name: MINIO_OPERATOR_TLS_ENABLE
        value: "off"
      - name: CLUSTER_DOMAIN
        value: "cluster.local"
      - name: WATCHED_NAMESPACE # Watch all namespaces for Minio Tenants
        value: ""
      - name: PROMETHEUS_NAMESPACE
        value: "monitoring"
    # The 7.1.1 prefix is the upstream minio/operator version, held by the compatibility
    # group in renovate.json5 so Renovate only advances the hardened recipe suffix.
    # minio/operator is archived at v7.1.1, so that prefix is not expected to move.
    image:
      # renovate: datasource=docker depName=hardened/minio-operator-ubi9 packageName=europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/minio-operator-ubi9
      repository: europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/minio-operator-ubi9
      tag: 7.1.1-ubi9-v1.4.20
    sidecarImage:
      # renovate: datasource=docker depName=hardened/minio-operator-sidecar-ubi9 packageName=europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/minio-operator-sidecar-ubi9
      repository: europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/minio-operator-sidecar-ubi9
      tag: 7.1.1-ubi9-v1.4.15
    imagePullSecrets: []
    initcontainers: []
    securityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
      fsGroup: 1000
    containerSecurityContext:
      runAsUser: 1000
      runAsGroup: 1000
      runAsNonRoot: true
    nodeSelector: {}
    affinity:
      podAntiAffinity:
        requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchExpressions:
                - key: name
                  operator: In
                  values:
                    - spore-storage
            topologyKey: kubernetes.io/hostname
    tolerations: []
    topologySpreadConstraints: []

tenant:
  name: spore-object-store
  storageClass: gce-pd-cmek-standard

  console:
    enableIngress: true
    # Port of the operator-managed `<tenant.name>-console` Service that the HTTPRoute
    # targets. MinIO's console default; override only if the operator's console port changes.
    servicePort: 9090

  annotations:
    argocd.argoproj.io/sync-wave: "5" # ensure tenant is created after operator and CRDs

  # Use a certificate issued by the Kubernetes cluster CA. Requires connections to be made 'insecurely' (skipping cert verification) over HTTPS.
  # If running with mTLS in a service mesh, this can be disabled and all communication can happen over HTTP relying on mTLS for encryption.
  requestAutoCert: false

  # This configuration is for the Root MinIO tenant.
  serverConfiguration: # MinIO server configuration variables https://min.io/docs/minio/linux/reference/minio-server/minio-server.html
    name: spore-minio-server-envs
  # This configuration is for the Regular MinIO tenant.
  users:
    - spore-storage-user

  # renovate: datasource=docker depName=hardened/minio-ubi9 packageName=europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/minio-ubi9
  image: europe-west2-docker.pkg.dev/skyr-artefacts/skyral-images/hardened/minio-ubi9:RELEASE.2026-06-18T00-00-00Z-ubi9-v1.5.18
  # Expand cluster capacity by adding new pools
  # extraPools:
  #   - name: new-pool
  #     serversPerPool: 4
  #     drivesPerServer: 1
  #     capacityPerDrive: 1G
  #     storageClass: standard
  initBuckets:
    - name: skyral-foundations
      objectLock: true
  userName: spore-storage-user

  # Disable auto-creation of root and normal user secrets. These should be supplied as pre-existing secret by infrastructure module instead.
  createRootUserSecret: false
  createUserSecret: false

  prometheusOperator: false
  prometheusNamespace: monitoring
  env:
    - name: MINIO_PROMETHEUS_AUTH_TYPE
      value: public
    - name: MINIO_PROMETHEUS_JOB_ID
      value: spore-object-store-minio-job
    - name: MINIO_PROMETHEUS_URL
      value: http://spore-observability-prometheus.monitoring.svc.cluster.local:9090
    - name: MINIO_STORAGE_CLASS_STANDARD
      value: "EC:0"
    - name: MINIO_BROWSER
      value: "on"
  logging:
    json: true

# Use External Secrets Operator to fetch secrets from your SecretStore and populate Kubernetes Secrets.
# Secret Store configuration and operator deployment are found in SPORE Essentials.
# Documentation: https://external-secrets.io/latest/api/externalsecret/
externalSecrets:
  enabled: true
  refreshInterval: "10m"
  secretStore:
    name: gcp-store # Name of the SecretStore CRD
    kind: ClusterSecretStore
  secrets: []
  sporeStorageUser:
    enabled: true
    secretName: "spore-storage-user"
    duplication:
      namespaces: []
      targetSecretName: "spore-storage-user" # The name of the target secret to create in the target namespaces
